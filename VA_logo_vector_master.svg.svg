<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">VA logo</title>
  <desc id="desc">Logo VA con V azul, A verde, horizonte multicolor y sol naranja. Fondo transparente.</desc>

  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21A8F6"/>
      <stop offset="100%" stop-color="#0B49E8"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BCB17"/>
      <stop offset="100%" stop-color="#24A72E"/>
    </linearGradient>

    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC21A"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>

    <linearGradient id="horizonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B49E8"/>
      <stop offset="28%" stop-color="#16A6EF"/>
      <stop offset="50%" stop-color="#43B02A"/>
      <stop offset="70%" stop-color="#D6CF00"/>
      <stop offset="86%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>

  <!-- V -->
  <path d="M105 65 L305 65 L515 305 L710 65 L900 65 L525 430 L470 430 Z"
        fill="url(#blueGrad)"/>

  <!-- A -->
  <path d="M565 405 L900 90 L1165 385 L1015 385 L900 240 L800 350 L1005 350 L1065 420 L700 420 Z"
        fill="url(#greenGrad)"/>

  <!-- Sol -->
  <g>
    <path d="M1228 351
             A115 115 0 0 1 1458 351
             Z"
          fill="url(#sunGrad)"/>
    <g stroke="#FFB000" stroke-width="15" stroke-linecap="round">
      <line x1="1343" y1="165" x2="1343" y2="112"/>
      <line x1="1230" y1="214" x2="1190" y2="174"/>
      <line x1="1456" y1="214" x2="1496" y2="174"/>
    </g>
  </g>

  <!-- Horizonte -->
  <path d="M70 490
           C 355 395, 650 355, 980 352
           C 1210 350, 1410 370, 1560 410"
        fill="none"
        stroke="url(#horizonGrad)"
        stroke-width="15"
        stroke-linecap="round"/>
</svg>
